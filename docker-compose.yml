# Local stack: API + SQL Server 2022 + Redis 7. See docs/docker.md.
# Secrets come from a git-ignored .env file (copy .env.example). Only the API is published to
# the host, on 127.0.0.1; SQL Server and Redis are reachable only inside the Compose network.

# Fixed project name so container, network and volume names (urlshortener-stack-*) never clash
# with the standalone urlshortener-sql / urlshortener-redis containers or their volume.
name: urlshortener-stack

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    volumes:
      - sql-data:/var/opt/mssql
    # SQL Server needs at least 2 GB; it uses up to ~80% of this limit by default.
    mem_limit: 2g
    healthcheck:
      # $$ defers expansion to the container's shell, so the password never appears in the
      # Compose model or in `docker inspect` output for the healthcheck.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q \"SELECT 1\" > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # A cache only: bounded memory with LRU eviction and no persistence. Redirects fall back to
    # SQL Server when Redis is empty or down.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # One-shot: applies pending EF Core migrations (creating the database if needed), then exits.
  # Idempotent, so it runs on every `docker compose up`.
  migrate:
    build:
      context: .
      target: migrator
    image: urlshortener-stack/migrator:local
    environment:
      ConnectionStrings__UrlShortener: "Server=sql,1433;Database=UrlShortener;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    image: urlshortener-stack/api:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__UrlShortener: "Server=sql,1433;Database=UrlShortener;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379,asyncTimeout=500"
      ShortUrls__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:${API_HOST_PORT:-8080}}
      Analytics__VisitorHashSecret: ${ANALYTICS_VISITOR_HASH_SECRET:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl; bash's /dev/tcp sends the request. Readiness is used for
      # status reporting (Compose does not restart unhealthy containers). The timeout is above
      # the API's 3 s SQL check timeout.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  sql-data:
