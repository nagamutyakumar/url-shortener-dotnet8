name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the older run. Pushes to main are never
# cancelled, so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UrlShortener.sln

      - name: Build (Release)
        run: dotnet build UrlShortener.sln --configuration Release --no-restore

      # Tests use EF Core InMemory and test doubles; no SQL Server, Redis, Docker,
      # user-secrets or credentials are needed.
      - name: Test
        run: >
          dotnet test UrlShortener.sln
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7
